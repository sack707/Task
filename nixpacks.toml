[providers]
providers = ["node"]

[variables]
PATH = "/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/app/node_modules/.bin:$PATH"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm db:generate", "pnpm run build"]

[start]
cmd = "pnpm --filter api db:push || true && pnpm --filter api start:prod"
